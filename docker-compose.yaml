services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledgerly -d ledgerly" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: